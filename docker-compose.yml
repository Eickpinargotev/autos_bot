name: autos

x-bot-environment: &bot-environment
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  EVAL_JUDGE_MODEL: ${EVAL_JUDGE_MODEL:-gpt-4o-mini}
  POSTGRES_URL: postgresql://${POSTGRES_USER:-mi_usuario_db}:${POSTGRES_PASSWORD:-mi_password_seguro}@postgres:5432/${POSTGRES_DB:-mi_base_de_datos}
  NOCODB_URL: http://nocodb:8080
  NOCODB_API_KEY: ${NOCODB_API_KEY}
  NOCODB_TABLE_LOGS: ${NOCODB_TABLE_LOGS}
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  NOCODB_INVITACIONES_URL: ${NOCODB_INVITACIONES_URL}
  NOCODB_REPORTES_URL: ${NOCODB_REPORTES_URL}
  NOCODB_CONVERSATIONS_URL: ${NOCODB_CONVERSATIONS_URL:-http://nocodb:8080/api/v3/data/p4f9fruiaxeixtc/mjgl77lakf4yfu1/records?pageSize=25&viewId=vw9rg1umoeoa3fv5}
  NOCODB_CONVERSATION_SHOTS_URL: ${NOCODB_CONVERSATION_SHOTS_URL:-}
  NOCODB_KEYWORD_REGISTROS_URL: ${NOCODB_KEYWORD_REGISTROS_URL:-http://nocodb:8080/api/v3/data/pw9kkys1galzvcp/mkzxugucz0hw8jm/records?pageSize=25&viewId=vw9k9ye2nq4vkiyz}
  NOCODB_RAG_CHUNKS_URL: ${NOCODB_RAG_CHUNKS_URL:-http://nocodb:8080/api/v3/data/pw9kkys1galzvcp/mlk30zxjzj4lfd8/records?pageSize=25&viewId=vwg13qjbfyahfw61}
  NOCODB_UNANSWERED_QUESTIONS_URL: ${NOCODB_UNANSWERED_QUESTIONS_URL:-http://nocodb:8080/api/v3/data/pw9kkys1galzvcp/m3s3ug74dil489y/records?pageSize=25&viewId=vwkfzfhfedwl5u2n}
  NOCODB_RAG_WEBHOOK_TOKEN: ${NOCODB_RAG_WEBHOOK_TOKEN:-}
  RAG_CONVERSATION_HISTORY_LIMIT: ${RAG_CONVERSATION_HISTORY_LIMIT:-5}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
  RAG_SYNC_TTL_SECONDS: ${RAG_SYNC_TTL_SECONDS:-300}
  NOCODB_TOKEN: ${NOCODB_TOKEN}
  GOOGLE_DRIVE_IMAGE_DOWNLOAD_URL_TEMPLATE: ${GOOGLE_DRIVE_IMAGE_DOWNLOAD_URL_TEMPLATE:-https://drive.google.com/uc?export=download&id={image_id}}
  OUTBOUND_IMAGE_TIMEOUT_SECONDS: ${OUTBOUND_IMAGE_TIMEOUT_SECONDS:-30}
  OUTBOUND_IMAGE_MAX_BYTES: ${OUTBOUND_IMAGE_MAX_BYTES:-15000000}
  PUB_DELAY_1_SEC: ${PUB_DELAY_1_SEC}
  PUB_DELAY_2_SEC: ${PUB_DELAY_2_SEC}
  PUB_DELAY_3_SEC: ${PUB_DELAY_3_SEC}
  MESSAGE_BUFFER_SECONDS: ${MESSAGE_BUFFER_SECONDS:-15}
  MSG_DELAY_MIN: ${MSG_DELAY_MIN}
  MSG_DELAY_MAX: ${MSG_DELAY_MAX}

x-bot-build: &bot-build
  context: ./services/bot_agent
  dockerfile: Dockerfile
  target: prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mi_usuario_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mi_password_seguro}
      POSTGRES_DB: ${POSTGRES_DB:-mi_base_de_datos}
    volumes:
      - autos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - autos_redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - autos_qdrant_data:/qdrant/storage
    restart: unless-stopped

  nocodb:
    image: nocodb/nocodb:2026.05.0
    environment:
      HOST: 0.0.0.0
    expose:
      - "8080"
    networks:
      - default
      - easypanel
    volumes:
      - autos_nocodb_data:/usr/app/data
    restart: unless-stopped

  nocodb_data_migrate:
    image: alpine:3.20
    profiles:
      - migrate
    command: sh -c "cp -r /seed/. /target/ && chmod -R 777 /target"
    volumes:
      - ./data/nocodb_metadata:/seed:ro
      - autos_nocodb_data:/target
    restart: "no"

  bot_agent:
    build: *bot-build
    environment: *bot-environment
    volumes:
      - ./mensajes.json:/mensajes.json:ro
    depends_on:
      - postgres
      - redis
      - nocodb
      - qdrant
    restart: unless-stopped

  celery_worker:
    build: *bot-build
    environment: *bot-environment
    volumes:
      - ./mensajes.json:/mensajes.json:ro
    depends_on:
      - postgres
      - redis
      - qdrant
    # -B: corre el scheduler beat embebido (purga diaria del historial vencido).
    # -s: el archivo de agenda va a /tmp para no tocar el código montado.
    command: celery -A src.infrastructure.tasks.celery_app worker -B -s /tmp/celerybeat-schedule --loglevel=info
    restart: unless-stopped

  whatsapp_webhook:
    build: *bot-build
    environment: *bot-environment
    expose:
      - "8010"
    volumes:
      - ./mensajes.json:/mensajes.json:ro
    depends_on:
      - postgres
      - redis
      - nocodb
      - qdrant
    command: uvicorn src.infrastructure.webhooks.app:app --host 0.0.0.0 --port 8010
    restart: unless-stopped

volumes:
  autos_postgres_data:
    name: autos_postgres_data
  autos_redis_data:
    name: autos_redis_data
  autos_qdrant_data:
    name: autos_qdrant_data
  autos_nocodb_data:
    name: autos_nocodb_data

networks:
  default:
  easypanel:
    external: true
