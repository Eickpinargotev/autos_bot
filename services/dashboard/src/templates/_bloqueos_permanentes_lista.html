<div class="panel tabla-scroll">
  <table>
    <thead><tr><th>Número</th><th>Desde</th><th></th></tr></thead>
    <tbody>
      {% for b in bloqueos %}
      <tr>
        <td><strong>{{ b.numero }}</strong></td>
        <td style="white-space:nowrap">{{ b.creado_en | fecha }}</td>
        <td class="acciones">
          <form method="post" action="/configuracion-proyecto/bloqueos/{{ b.id }}/eliminar"
                data-config-proyecto-form>
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <button class="mini peligro">Eliminar</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="vacio">
        {% if busqueda %}Ningún número coincide con «{{ busqueda }}».
        {% else %}No hay números bloqueados permanentemente.{% endif %}
      </td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
