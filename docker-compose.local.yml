# Compose LOCAL: publica puertos, monta el código con bind mount y construye
# la etapa `dev` (con pytest). Para la nube, ver docker-compose.yml.
#
# LOS PUERTOS DEL HOST SON AUTOMÁTICOS. La parte izquierda de cada `ports:` está
# vacía a propósito (`"${DASHBOARD_PORT:-}:8020"`): sin valor, Docker elige un
# puerto libre y esta pila convive con cualquier otra que ya tenga ocupado el
# 5432, el 6379 o el 8020. Dentro de la red de Docker los servicios se siguen
# hablando por el puerto de SIEMPRE (`postgres:5432`, `qdrant:6333`), así que
# esto no toca ninguna configuración de la aplicación.
#
# Para ver qué puerto te tocó:
#     docker compose -f docker-compose.local.yml port dashboard 8020
#     docker compose -f docker-compose.local.yml ps        # todos de un vistazo
#
# El puerto CAMBIA en cada recreación del contenedor. Si necesitas uno fijo
# (un cliente de base de datos que lo tenga guardado, un marcador del panel),
# ponlo en el .env: DASHBOARD_PORT=8020, POSTGRES_PORT=5432, REDIS_PORT=6379,
# QDRANT_PORT=6333, QDRANT_GRPC_PORT=6334, WEBHOOK_PORT=8010.

x-bot-environment: &bot-environment
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
  EVAL_JUDGE_MODEL: ${EVAL_JUDGE_MODEL:-gpt-4o-mini}
  POSTGRES_URL: postgresql://${POSTGRES_USER:-mi_usuario_db}:${POSTGRES_PASSWORD:-mi_password_seguro}@postgres:5432/${POSTGRES_DB:-mi_base_de_datos}
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  RAG_CONVERSATION_HISTORY_LIMIT: ${RAG_CONVERSATION_HISTORY_LIMIT:-5}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
  RAG_SYNC_TTL_SECONDS: ${RAG_SYNC_TTL_SECONDS:-300}
  # WhatsApp (WasenderAPI). Sin credenciales el canal queda inactivo.
  WASENDER_API_URL: ${WASENDER_API_URL:-https://wasenderapi.com}
  WASENDER_WEBHOOK_SECRET: ${WASENDER_WEBHOOK_SECRET:-}
  # Token compartido con el dashboard para los endpoints internos del bot.
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
  GOOGLE_DRIVE_IMAGE_DOWNLOAD_URL_TEMPLATE: ${GOOGLE_DRIVE_IMAGE_DOWNLOAD_URL_TEMPLATE:-https://drive.google.com/uc?export=download&id={image_id}}
  OUTBOUND_IMAGE_TIMEOUT_SECONDS: ${OUTBOUND_IMAGE_TIMEOUT_SECONDS:-30}
  OUTBOUND_IMAGE_MAX_BYTES: ${OUTBOUND_IMAGE_MAX_BYTES:-15000000}
  PUB_DELAY_1_SEC: ${PUB_DELAY_1_SEC}
  PUB_DELAY_2_SEC: ${PUB_DELAY_2_SEC}
  PUB_DELAY_3_SEC: ${PUB_DELAY_3_SEC}
  MESSAGE_BUFFER_SECONDS: ${MESSAGE_BUFFER_SECONDS:-15}
  MSG_DELAY_MIN: ${MSG_DELAY_MIN}
  MSG_DELAY_MAX: ${MSG_DELAY_MAX}

x-dashboard-environment: &dashboard-environment
  POSTGRES_URL: postgresql://${POSTGRES_USER:-mi_usuario_db}:${POSTGRES_PASSWORD:-mi_password_seguro}@postgres:5432/${POSTGRES_DB:-mi_base_de_datos}
  SESSION_SECRET: ${SESSION_SECRET:-secreto-solo-para-desarrollo-local}
  # En local no hay HTTPS: con COOKIE_SECURE=true el navegador no mandaría la cookie.
  COOKIE_SECURE: "false"
  # Cuenta de administrador. El .env manda: si cambias ADMIN_PASSWORD aquí, el
  # próximo arranque la aplica. Si la cambias desde el panel o la recuperas por
  # Telegram, el arranque NO la pisa (ver usuarios.sincronizar_admin).
  ADMIN_USER: ${ADMIN_USER:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  # Único destino del código de recuperación. Sin acceso a este Telegram nadie
  # puede recuperar la cuenta, aunque conozca el usuario.
  ADMIN_TELEGRAM_CHAT_ID: ${ADMIN_TELEGRAM_CHAT_ID:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  # Espera aleatoria entre las partes de un mismo mensaje, para que una cadena
  # de envíos no salga a ritmo constante (la firma más obvia de un bot).
  ENVIO_DELAY_MIN_SEGUNDOS: ${ENVIO_DELAY_MIN_SEGUNDOS:-1}
  ENVIO_DELAY_MAX_SEGUNDOS: ${ENVIO_DELAY_MAX_SEGUNDOS:-6}
  BOT_WEBHOOK_URL: http://whatsapp_webhook:8010
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
  WASENDER_API_URL: ${WASENDER_API_URL:-https://wasenderapi.com}
  # En local el webhook no es alcanzable desde internet: para probar con
  # WasenderAPI de verdad hay que exponer el 8010 con un túnel (ngrok, cloudflared)
  # y poner aquí esa URL — de eso se encarga `scripts/tunel_webhook.sh`, que
  # además averigua solo el puerto que le tocó al webhook. Sin eso, el panel
  # muestra la ruta y avisa de que falta.
  PUBLIC_WEBHOOK_BASE_URL: ${PUBLIC_WEBHOOK_BASE_URL:-}
  ZONA_HORARIA: ${ZONA_HORARIA:-America/Costa_Rica}

x-bot-build: &bot-build
  context: ./services/bot_agent
  dockerfile: Dockerfile
  target: dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mi_usuario_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mi_password_seguro}
      POSTGRES_DB: ${POSTGRES_DB:-mi_base_de_datos}
    # Puerto del host AUTOMÁTICO: con la parte izquierda vacía Docker elige uno
    # libre y no choca con otro Postgres ya levantado en la máquina. Para fijarlo
    # (p. ej. para un cliente de base de datos que lo tenga guardado), pon
    # POSTGRES_PORT=5432 en el .env. Ver la nota de puertos al final del archivo.
    ports:
      - "${POSTGRES_PORT:-}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    # AOF (appendonly) + maxmemory/volatile-lru: ver nota en docker-compose.yml.
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy volatile-lru
    ports:
      - "${REDIS_PORT:-}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "${QDRANT_PORT:-}:6333"
      - "${QDRANT_GRPC_PORT:-}:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
      target: dev
    container_name: dashboard_app
    environment: *dashboard-environment
    ports:
      - "${DASHBOARD_PORT:-}:8020"
    volumes:
      - ./services/dashboard:/app
    depends_on:
      - postgres
    restart: unless-stopped

  bot_agent:
    build: *bot-build
    container_name: bot_agent_telegram
    environment: *bot-environment
    volumes:
      - ./services/bot_agent:/app
      - ./mensajes.json:/mensajes.json:ro
    depends_on:
      - postgres
      - redis
      - qdrant
    restart: unless-stopped

  celery_worker:
    build: *bot-build
    container_name: bot_agent_worker
    environment: *bot-environment
    volumes:
      - ./services/bot_agent:/app
      - ./mensajes.json:/mensajes.json:ro
    depends_on:
      - postgres
      - redis
      - qdrant
    # -B: corre el scheduler beat embebido (purga diaria del historial vencido y
    #     drenaje de la cola de envíos manuales del dashboard).
    # -s: el archivo de agenda va a /tmp para no tocar el código montado.
    # --pool=threads --concurrency=20: tareas I/O-bound (esperan al LLM). Ver nota
    #   detallada en docker-compose.yml (igual que --statedb).
    command: celery -A src.infrastructure.tasks.celery_app worker -B -s /tmp/celerybeat-schedule --statedb=/tmp/celery-worker-state --pool=threads --concurrency=20 --loglevel=info
    restart: unless-stopped

  whatsapp_webhook:
    build: *bot-build
    container_name: whatsapp_webhook
    environment: *bot-environment
    ports:
      - "${WEBHOOK_PORT:-}:8010"
    volumes:
      - ./services/bot_agent:/app
      - ./mensajes.json:/mensajes.json:ro
    depends_on:
      - postgres
      - redis
      - qdrant
    command: uvicorn src.infrastructure.webhooks.app:app --host 0.0.0.0 --port 8010
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
